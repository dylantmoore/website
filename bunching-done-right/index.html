  --display-tracking: 0.005em;
  --text: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --ui: "Inter Tight", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --caps: "Josefin Sans", "Inter Tight", sans-serif;
  --math: "Latin Modern Math", "Source Serif 4", serif;
  --ornament-display: block;
}
:root[data-theme="classic"] {
  --paper: #fcfaf6;
  --paper-warm: #fbf8f2;
  --ink: #231f20;
  --ink-muted: #6f6962;
  --guide: #afabab;
  --peach: #fbe5d6;
  --sand: #e7dfd2;
  --lower: #00a5ab;
  --lower-soft: #66c9cc;
  --buncher: #ea1c35;
  --buncher-soft: #f27685;
  --upper: #394ba0;
  --upper-soft: #8893c6;
  --cosine: #1f3a6e;
  --sine: #9a5f16;
  --gold: #fbe5d6;
  --bronze: #6f6962;
  --brass: #afabab;
  --eyebrow: var(--buncher);
  --alt-1: #9a5f16;
  --alt-2: #6f4a86;
  --rule: var(--ink);
  @supports (color: color-mix(in lab, red, red)) {
    --rule: color-mix(in srgb, var(--ink) 22%, transparent);
  }
  --display: "Editorial Display", "Iowan Old Style", Palatino, serif;
  --display-weight: 600;
  --display-tracking: -0.035em;
  --text: "Editorial Text", "Iowan Old Style", Palatino, serif;
  --ui: Graphik, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --caps: Graphik, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --math: "Latin Modern Math", "Editorial Text", serif;
  --ornament-display: none;
}
* {
  box-sizing: border-box;
}
html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--paper);
}
body {
  color: var(--ink);
  font-family: var(--text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button,
input {
  font: inherit;
}
button {
  color: inherit;
}
button:focus-visible,
input:focus-visible,
a:focus-visible,
summary:focus-visible {
  outline: 2px solid var(--buncher);
  outline-offset: 3px;
}
.inline-latex {
  display: inline-flex;
  align-items: baseline;
  max-width: 100%;
  vertical-align: -0.08em;
  white-space: nowrap;
}
.inline-latex .katex,
.block-latex .katex {
  font-size: 1em;
}
.block-latex,
.block-latex .katex-display {
  width: 100%;
  margin: 0;
}
.svg-math-label {
  overflow: visible;
  color: inherit;
  pointer-events: none;
}
.svg-math-inner {
  display: flex;
  align-items: center;
  width: 100%;
  height: 100%;
  overflow: visible;
  white-space: nowrap;
}
.svg-math-inner.align-start {
  justify-content: flex-start;
  text-align: left;
}
.svg-math-inner.align-middle {
  justify-content: center;
  text-align: center;
}
.svg-math-inner.align-end {
  justify-content: flex-end;
  text-align: right;
}
.svg-math-label .katex-html {
  text-shadow: 0 0 2px var(--paper),
    0 0 4px var(--paper),
    0 0 6px var(--paper);
}
.lecture-app {
  --sidebar-width: clamp(350px, 26.5cqw, 392px);
  --header-height: 44px;
  --transport-height: 54px;
  --strip-height: 108px;
  --frame-pad: 9px;
  position: relative;
  display: grid;
  grid-template-rows: var(--header-height) minmax(0, 1fr) var(--transport-height);
  width: 100cqw;
  height: 100%;
  overflow: hidden;
  padding: var(--frame-pad);
  background: var(--paper);
}
:root[data-theme="classic"] .lecture-app {
  --frame-pad: 0px;
}
.deco-frame {
  display: var(--ornament-display);
  position: absolute;
  z-index: 5;
  inset: 5px;
  border: 1.5px solid var(--ink);
  pointer-events: none;
}
.deco-frame::after {
  content: "";
  position: absolute;
  inset: 3px;
  border: 1px solid var(--brass);
}
.deco-corner {
  position: absolute;
  width: 22px;
  height: 22px;
  overflow: visible;
}
.deco-corner path {
  fill: none;
  stroke: var(--brass);
  stroke-width: 1.4;
}
.deco-corner-tl {
  top: 3px;
  left: 3px;
}
.deco-corner-tr {
  top: 3px;
  right: 3px;
  transform: scaleX(-1);
}
.deco-corner-bl {
  bottom: 3px;
  left: 3px;
  transform: scaleY(-1);
}
.deco-corner-br {
  right: 3px;
  bottom: 3px;
  transform: scale(-1, -1);
}
.deco-ornament {
  display: var(--ornament-display);
}
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-width: 0;
  padding: 0 22px;
  border-bottom: 1px solid var(--rule);
  font-family: var(--ui);
}
.compact-wordmark {
  display: flex;
  align-items: baseline;
  gap: 18px;
  min-width: 0;
  color: inherit;
  text-decoration: none;
}
.compact-wordmark strong {
  text-decoration: underline;
  text-decoration-color: transparent;
  text-decoration-thickness: 1px;
  text-underline-offset: 5px;
  transition: text-decoration-color 160ms ease;
}
.compact-wordmark:hover strong,
.compact-wordmark:focus-visible strong {
  text-decoration-color: var(--brass);
}
.compact-wordmark strong {
  font-family: var(--display);
  font-size: 22px;
  font-weight: var(--display-weight);
  letter-spacing: var(--display-tracking);
  white-space: nowrap;
}
:root:not([data-theme="classic"]) .compact-wordmark strong {
  font-size: 21px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.compact-wordmark em {
  color: var(--buncher);
  font-family: inherit;
  font-style: normal;
  font-weight: inherit;
}
:root[data-theme="classic"] .compact-wordmark em {
  font-family: var(--text);
  font-style: italic;
  font-weight: 400;
}
.compact-wordmark span,
.chapter-label span {
  color: var(--eyebrow);
  font-family: var(--caps);
  font-size: 12.5px;
  font-weight: 650;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 26px;
  min-width: 0;
  white-space: nowrap;
}
.compact-wordmark span {
  white-space: nowrap;
}
.chapter-switcher-trigger strong {
  max-width: 36cqw;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
@container bdr (max-width: 1299px) {
  .compact-wordmark span {
    display: none;
  }
  .header-right {
    gap: 20px;
  }
  .chapter-switcher-trigger strong {
    max-width: 40cqw;
  }
}
.theme-toggle {
  display: flex;
  gap: 2px;
  font-family: var(--caps);
}
.theme-toggle button {
  padding: 4px 8px 3px;
  border: 1px solid transparent;
  background: none;
  color: var(--ink-muted);
  font-size: 12.5px;
  font-weight: 650;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
}
.theme-toggle button.is-current {
  border-color: var(--rule);
  color: var(--ink);
}
.chapter-label {
  position: relative;
  display: flex;
  align-items: baseline;
  gap: 14px;
  font-size: 14px;
}
.chapter-label strong {
  font-weight: 600;
}
.chapter-switcher-trigger {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
}
.chapter-switcher-trigger i {
  color: var(--ink-muted);
  font-size: 11px;
  font-style: normal;
}
.chapter-switcher-menu {
  position: absolute;
  z-index: 20;
  top: calc(100% + 15px);
  right: 0;
  width: min(480px, calc(100cqw - 64px));
  max-height: calc(100cqh - 92px);
  padding: 16px;
  overflow-y: auto;
  border: 1px solid var(--rule);
  border-radius: 2px;
  background: var(--paper);
  box-shadow: 0 16px 45px var(--ink);
  @supports (color: color-mix(in lab, red, red)) {
    box-shadow: 0 16px 45px color-mix(in srgb, var(--ink) 16%, transparent);
  }
}
.chapter-switcher-menu section + section {
  margin-top: 13px;
  padding-top: 12px;
  border-top: 1px solid var(--ink);
  @supports (color: color-mix(in lab, red, red)) {
    border-top: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
  }
}
.chapter-switcher-menu p {
  margin: 0 0 5px;
  font-size: 13px;
  font-weight: 700;
}
.chapter-switcher-menu a,
.chapter-switcher-menu section > button {
  display: grid;
  grid-template-columns: 28px 1fr;
  width: 100%;
  padding: 5px 0;
  border: 0;
  background: transparent;
  color: var(--ink);
  font-size: 14px;
  line-height: 1.25;
  text-align: left;
  text-decoration: none;
}
.chapter-switcher-menu a:hover {
  color: var(--buncher);
}
.chapter-switcher-menu a[aria-current="page"] {
  font-weight: 700;
}
.chapter-switcher-menu section > button:disabled {
  color: var(--ink-muted);
  cursor: not-allowed;
  opacity: 0.58;
}
.lesson-viewport {
  display: grid;
  grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
  gap: 26px;
  min-width: 0;
  min-height: 0;
  padding: 10px 22px 8px;
  touch-action: pan-y pinch-zoom;
}
.lesson-viewport > .explanation-panel {
  grid-column: 1;
  grid-row: 1;
}
.lesson-viewport > .figure-panel {
  grid-column: -2 / -1;
  grid-row: 1;
}
.explanation-panel {
  position: relative;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  padding: 8px 22px 0 8px;
  border-right: 1px solid var(--rule);
}
.sidebar-head {
  flex: 0 0 auto;
}
.sidebar-eyebrow {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin: 0 0 10px;
  color: var(--eyebrow);
  font-family: var(--caps);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.14em;
  line-height: 1.2;
  text-transform: uppercase;
}
.sidebar-eyebrow-number {
  white-space: nowrap;
}
.sidebar-eyebrow-name {
  min-width: 0;
  line-height: 1.25;
}
:root:not([data-theme="classic"]) .sidebar-eyebrow > span {
  padding-top: 3px;
}
.deco-crest {
  flex: 0 0 auto;
  width: 34px;
  height: 19px;
  margin-right: 2px;
  overflow: visible;
}
.deco-crest path {
  fill: none;
  stroke: var(--brass);
  stroke-width: 1.5;
  stroke-linecap: round;
}
.deco-crest .deco-crest-sun {
  fill: var(--brass);
  stroke: none;
}
.sidebar-title {
  margin: 0;
  color: var(--ink);
  font-family: var(--display);
  font-size: 38px;
  font-weight: var(--display-weight);
  letter-spacing: var(--display-tracking);
  line-height: 1.02;
  text-wrap: balance;
}
.sidebar-title {
  position: relative;
}
.sidebar-title-text[data-role="lower"] {
  color: var(--lower);
}
.sidebar-title-text[data-role="upper"] {
  color: var(--upper);
}
.sidebar-title-text[data-role="buncher"] {
  color: var(--buncher);
}
.sidebar-title-text.is-entering {
  animation: sidebar-title-in 220ms ease-out both;
}
.sidebar-title-text.is-leaving {
  position: absolute;
  inset: 0 0 auto;
  text-wrap: balance;
  pointer-events: none;
  animation: sidebar-title-out 180ms ease-in both;
}
@keyframes sidebar-title-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes sidebar-title-out {
  from {
    opacity: 1;
  }
  to {
    opacity: 0;
  }
}
.explanation-panel[data-sidebar="revised"] .sidebar-title-text {
  display: block;
  font-size: calc(1em * var(--title-scale, 1));
}
.explanation-panel[data-sidebar="revised"] .sidebar-title-text[data-size="1"] {
  --title-scale: 0.9;
}
.explanation-panel[data-sidebar="revised"] .sidebar-title-text[data-size="2"] {
  --title-scale: 0.82;
}
.explanation-panel[data-sidebar="revised"] .sidebar-title-text[data-size="3"] {
  --title-scale: 0.76;
}
.sidebar-head::after {
  content: "";
  display: block;
  width: 100%;
  height: 0;
  margin-top: 14px;
  border-top: 1px solid var(--brass);
}
:root[data-theme="classic"] .sidebar-head::after {
  border-top-color: var(--rule);
}
.derivation-slot {
  flex: 0 0 auto;
  min-width: 0;
  margin: 14px 0 0;
  padding: 12px 4px 12px 14px;
  border-left: 3px solid var(--buncher);
  background: var(--peach);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in srgb, var(--peach) 34%, var(--paper));
  }
  color: var(--ink);
  font-family: var(--math);
  font-size: 21px;
  line-height: 1.4;
}
.derivation-slot .katex-display {
  overflow-x: auto;
  overflow-y: hidden;
  text-align: left;
}
.derivation-slot .katex-display > .katex {
  text-align: left;
}
.narration-list {
  display: flex;
  flex: 0 0 auto;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
  margin: 16px 0 0;
  padding: 0;
  list-style: none;
}
.narration-line {
  margin: 0;
  font-family: var(--text);
  text-wrap: pretty;
}
.narration-line.is-earlier {
  color: var(--ink);
  @supports (color: color-mix(in lab, red, red)) {
    color: color-mix(in srgb, var(--ink) 68%, var(--paper));
  }
  font-size: 16.5px;
  line-height: 1.38;
}
.narration-line.is-current {
  position: relative;
  padding-left: 14px;
  color: var(--ink);
  font-size: 20px;
  line-height: 1.42;
}
.narration-line.is-current::before {
  content: "";
  position: absolute;
  top: 0.32em;
  bottom: 0.32em;
  left: 0;
  width: 3px;
  background: var(--ink);
}
.narration-line em {
  color: var(--buncher);
  font-style: italic;
}
.narration-line.is-earlier em {
  color: inherit;
}
.narration-line.is-try::before {
  background: var(--buncher);
}
.narration-try-label {
  display: block;
  margin-bottom: 4px;
  color: var(--buncher);
  font-family: var(--caps);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.14em;
  line-height: 1.2;
  text-transform: uppercase;
}
.build-narration {
  display: inline;
}
.narration-line.build-enter-line {
  animation: narration-in 320ms ease-out both;
}
.narration-line.is-hidden {
  display: none;
}
.narration-fold {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 0 0 -2px;
  color: var(--eyebrow);
  font-family: var(--caps);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  line-height: 1;
  text-transform: uppercase;
}
.narration-fold[hidden] {
  display: none;
}
.narration-fold-pips {
  display: flex;
  flex: 0 1 auto;
  gap: 4px;
  min-width: 0;
}
.narration-fold-pips i {
  width: 7px;
  height: 7px;
  background: var(--brass);
  transform: rotate(45deg) scale(0.82);
}
:root[data-theme="classic"] .narration-fold-pips i {
  border-radius: 50%;
  background: var(--ink-muted);
  transform: none;
}
.narration-fold[data-capped="true"] .narration-fold-pips i:nth-child(1) {
  opacity: 0.45;
  transform: rotate(45deg) scale(0.36);
}
.narration-fold[data-capped="true"] .narration-fold-pips i:nth-child(2) {
  opacity: 0.65;
  transform: rotate(45deg) scale(0.52);
}
.narration-fold[data-capped="true"] .narration-fold-pips i:nth-child(3) {
  opacity: 0.85;
  transform: rotate(45deg) scale(0.68);
}
:root[data-theme="classic"] .narration-fold[data-capped="true"] .narration-fold-pips i:nth-child(1) {
  transform: scale(0.45);
}
:root[data-theme="classic"] .narration-fold[data-capped="true"] .narration-fold-pips i:nth-child(2) {
  transform: scale(0.6);
}
:root[data-theme="classic"] .narration-fold[data-capped="true"] .narration-fold-pips i:nth-child(3) {
  transform: scale(0.8);
}
.narration-fold-label {
  flex: 0 0 auto;
  padding-top: 2px;
  white-space: nowrap;
}
.narration-fold::after {
  content: "";
  flex: 1 1 auto;
  min-width: 16px;
  border-top: 1px solid var(--brass);
}
:root[data-theme="classic"] .narration-fold::after {
  border-top-color: var(--rule);
}
.derivation-slot.has-derivation {
  padding-top: 0;
  padding-bottom: 0;
  padding-right: 10px;
}
.derivation-slot.has-derivation .dv-stage {
  padding-block: 12px;
}
.derivation-slot.has-derivation .dv-stage:empty {
  padding-block: 0;
}
.derivation-slot.has-derivation {
  transition: margin-top 260ms ease;
}
.derivation-slot.has-derivation[data-empty] {
  margin-top: 0;
}
.explanation-panel:not([data-compact="0"]) .derivation-slot:not(.has-derivation) {
  padding-top: 8px;
  padding-bottom: 8px;
}
.explanation-panel:not([data-compact="0"]) .derivation-slot.has-derivation .dv-stage:not(:empty) {
  padding-block: 8px;
}
.explanation-panel[data-compact="4"] .narration-line.is-current {
  font-size: 17.5px;
  line-height: 1.36;
}
.explanation-panel:not([data-compact="0"]) .sidebar-title {
  font-size: 32px;
}
.explanation-panel:not([data-compact="0"]) .sidebar-head::after {
  margin-top: 10px;
}
.sidebar-more {
  flex: 0 0 auto;
  margin-top: auto;
  padding: 10px 0 8px;
}
.sidebar-more summary {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-top: 9px;
  border-top: 1px solid var(--rule);
  color: var(--eyebrow);
  font-family: var(--caps);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.14em;
  line-height: 1.2;
  text-transform: uppercase;
  cursor: pointer;
  list-style: none;
}
.sidebar-more summary::-webkit-details-marker {
  display: none;
}
.sidebar-more summary::before {
  content: "+";
  display: inline-grid;
  place-items: center;
  width: 17px;
  height: 17px;
  border: 1px solid currentColor;
  font-family: var(--ui);
  font-size: 13px;
  letter-spacing: 0;
}
.sidebar-more[open] summary::before {
  content: "−";
}
.sidebar-more[open] {
  position: absolute;
  z-index: 3;
  inset: 0 22px 0 0;
  margin: 0;
  padding: 0 0 0 8px;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-color: var(--brass) transparent;
  @supports (color: color-mix(in lab, red, red)) {
    scrollbar-color: color-mix(in srgb, var(--brass) 55%, transparent) transparent;
  }
  scrollbar-width: thin;
  background: var(--paper);
}
.sidebar-more[open] summary {
  position: sticky;
  top: 0;
  z-index: 1;
  padding: 8px 0 10px;
  border-top: 0;
  border-bottom: 1px solid var(--rule);
  background: var(--paper);
}
.sidebar-more-fade {
  position: sticky;
  bottom: 0;
  height: 30px;
  pointer-events: none;
  background: linear-gradient(to bottom, var(--paper), var(--paper) 85%);
  @supports (color: color-mix(in lab, red, red)) {
    background: linear-gradient(to bottom, color-mix(in srgb, var(--paper) 0%, transparent), var(--paper) 85%);
  }
}
.sidebar-more-body {
  padding: 12px 6px 14px 0;
}
.sidebar-figure-title {
  margin: 0 0 12px;
  color: var(--ink-muted);
  font-family: var(--ui);
  font-size: 14px;
  line-height: 1.35;
}
.sidebar-figure-title span {
  margin-right: 6px;
  color: var(--eyebrow);
  font-family: var(--caps);
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.stage-explanation {
  margin: 0;
  font-family: var(--text);
  font-size: 17px;
  line-height: 1.45;
}
.stage-quote {
  margin: 14px 0 0;
  padding: 4px 0 4px 14px;
  border-left: 3px solid var(--lower);
}
.stage-quote p {
  margin: 0;
  font-family: var(--text);
  font-size: 16px;
  font-style: italic;
  line-height: 1.4;
}
.stage-quote footer {
  margin-top: 6px;
  color: var(--ink-muted);
  font-family: var(--ui);
  font-size: 13px;
  letter-spacing: 0.02em;
}
.definition-list {
  display: grid;
  gap: 0;
  margin: 14px 0 0;
  padding: 0;
  border-top: 1px solid var(--ink);
  @supports (color: color-mix(in lab, red, red)) {
    border-top: 1px solid color-mix(in srgb, var(--ink) 16%, transparent);
  }
}

.build-dots {

.build-dots i {
  width: 9px;
  height: 9px;
  border: 1px solid var(--ink);

    border: 1px solid color-mix(in srgb, var(--ink) 50%, transparent);

  background: transparent;
  transform: rotate(45deg) scale(0.82);
}
:root[data-theme="classic"] .build-dots i {
  border-radius: 50%;

.build-dots i.is-done {
  border-color: var(--ink);

}
.build-dots i.is-now {
  border-color: var(--buncher);
  background: var(--buncher);
}
.build-gauge {
  position: relative;
  flex: 0 0 auto;
  width: 150px;
  height: 11px;
  margin: 0 5px;
}
.build-gauge::before {
  content: "";
  position: absolute;
  inset: 5px 0 auto;
  border-top: 1px solid var(--ink);
  @supports (color: color-mix(in lab, red, red)) {
    border-top: 1px solid color-mix(in srgb, var(--ink) 45%, transparent);
  }
}
.build-gauge-fill {
  position: absolute;
  top: 4px;
  left: 0;
  width: calc(var(--gauge) * 100%);
  height: 3px;
  background: var(--ink);
}
.build-gauge::after,
.build-gauge-now {
  content: "";
  position: absolute;
  top: 1px;
  width: 9px;
  height: 9px;
  box-sizing: border-box;
  transform: rotate(45deg) scale(0.82);
}
.build-gauge::after {
  right: -5px;
  border: 1px solid var(--ink);
  @supports (color: color-mix(in lab, red, red)) {
    border: 1px solid color-mix(in srgb, var(--ink) 50%, transparent);
  }
  background: var(--paper);
}
.build-gauge-now {
  z-index: 1;
  left: calc(var(--gauge) * 100% - 4.5px);
  background: var(--buncher);
}
:root[data-theme="classic"] .build-gauge::after,
:root[data-theme="classic"] .build-gauge-now {
  border-radius: 50%;
  transform: none;
}
.ui-icon {
